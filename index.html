<style>
/* Layout: eine Spalte wie ein Logbuch, links eine Tiefenskala als Leitmotiv; App mit drei Ansichten (Start, Lernpaket, Quiz) */
:root{
  --bg:#EEF4F4; --surface:#FFFFFF; --ink:#0F2429; --muted:#4F656B; --line:#D3E0E2;
  --sea:#0B5563; --sea-soft:#DCEBEE; --buoy:#D9531A; --buoy-soft:#FBE6DB;
  --ok:#2D7A4C; --ok-soft:#DFF1E6; --bad:#B3261E; --bad-soft:#F8E0DE;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A191D; --surface:#11262C; --ink:#E3EEF0; --muted:#94AAB0; --line:#23414A;
  --sea:#6CBACA; --sea-soft:#163840; --buoy:#FF8048; --buoy-soft:#3A2218;
  --ok:#62C98F; --ok-soft:#163626; --bad:#FF8A80; --bad-soft:#3B1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A191D; --surface:#11262C; --ink:#E3EEF0; --muted:#94AAB0; --line:#23414A;
  --sea:#6CBACA; --sea-soft:#163840; --buoy:#FF8048; --buoy-soft:#3A2218;
  --ok:#62C98F; --ok-soft:#163626; --bad:#FF8A80; --bad-soft:#3B1C1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
a{color:var(--sea)}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}

/* Kopf mit Tiefenskala */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.hero > div{min-width:0;display:flex;flex-direction:column;gap:10px}
.gauge{width:118px;font-size:.72rem;font-variant-numeric:tabular-nums;color:var(--muted);position:relative;height:200px;border-left:3px solid var(--sea);margin-top:6px}
.gauge .mk{position:absolute;left:-3px;display:flex;align-items:center;gap:6px;transform:translateY(-50%);white-space:nowrap}
.gauge .mk::before{content:"";width:10px;height:3px;background:var(--sea)}
.gauge .mk.hot::before{background:var(--buoy);width:14px}
.gauge .mk b{color:var(--ink)}

.note{background:var(--sea-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.note.warn{background:var(--buoy-soft)}
.note h3{font-size:1rem}

/* Paketliste */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:2.6rem 1fr auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);
  background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit;width:100%}
.row:hover{background:var(--surface)}
.row .nr{font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--sea);font-variant-numeric:tabular-nums}
.row .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t b{font-size:1.02rem}
.row .t span{font-size:.85rem;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sea-soft);color:var(--sea);white-space:nowrap}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.safe{background:var(--buoy-soft);color:var(--buoy)}

.special{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.special button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:inherit;display:flex;flex-direction:column;gap:4px}
.special button b{font-family:var(--display);font-size:1.1rem}
.special button.sos{border-color:var(--buoy)}
.special button span{font-size:.85rem;color:var(--muted)}
@media (max-width:460px){.special{grid-template-columns:1fr}.gauge{display:none}.hero{grid-template-columns:1fr}}

/* Lernpaket */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{background:none;border:0;color:var(--sea);font-weight:700;padding:6px 0}
.sec{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.sec ul,.sec ol{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:4px}
.merke{border:2px solid var(--sea);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.merke ul{margin:0;padding-left:1.2rem}
.signs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sign{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.9rem}
.sign svg{width:64px;height:64px}
.src{font-size:.8rem;color:var(--muted)}
.btn{background:var(--sea);color:var(--bg);border:0;border-radius:10px;padding:12px 18px;font-weight:700}
.btn.alt{background:var(--surface);color:var(--sea);border:2px solid var(--sea)}
.btn.orange{background:var(--buoy);color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem}
td,th{border-bottom:1px solid var(--line);padding:6px 12px 6px 0;text-align:left}
.tbl{overflow-x:auto}
.raid{font-size:.72rem;font-weight:700;background:var(--buoy-soft);color:var(--buoy);padding:1px 6px;border-radius:4px;white-space:nowrap}

/* Quiz */
.levels{display:flex;gap:10px;flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea);transition:width .3s}
.q{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;color:var(--ink);min-height:52px}
.opt:hover:not(:disabled){border-color:var(--sea)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--display)}
.score{font-family:var(--display);font-weight:800;font-size:3rem;color:var(--sea);font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:12px}
.review div{border-left:3px solid var(--bad);padding-left:12px;display:flex;flex-direction:column;gap:2px;font-size:.95rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ===================== INHALT =====================
   Quelle aller Inhalte: RAID Open Water 20 Diver Kursmanuals (DE, Stand 05/2024).
   PADI-Altersregeln: blog.padi.com ("How old do you have to be to scuba dive").
*/
var R = '<span class="raid">RAID</span>';

var PAKETE = [
{ id:"regeln", titel:"Grundregeln und Begriffe", kurz:"Goldene Regeln, Buddy, Handzeichen, wichtige Wörter",
  quelle:"Tauchen im Allgemeinen; Management (Verfahren für sicheres Tauchen)",
  secs:[
  {h:"Die zwei goldenen Regeln", html:"<ol><li><b>Halte unter Wasser nie den Atem an.</b> Wenn du nicht einatmen kannst, atme aus.</li><li><b>Kenne jederzeit deinen Luftvorrat.</b> Schau regelmässig auf dein Finimeter (die Luftanzeige).</li></ol><p>Fast alles unter Wasser lässt sich lösen, solange du etwas zum Atmen hast.</p>"},
  {h:"Die fünf wichtigsten Regeln", html:"<ol><li>Atme ruhig und ohne Pause weiter.</li><li>Tauche langsam auf: höchstens <b>9 Meter pro Minute</b>.</li><li>Behalte deinen Luftvorrat und deine Instrumente im Blick.</li><li>Bleib nahe bei deinem Buddy.</li><li>Mach früh und oft den Druckausgleich in den Ohren.</li></ol>"},
  {h:"Der Buddy", html:"<p>Dein Buddy ist dein Tauchpartner. Ihr passt gegenseitig aufeinander auf: zwei Köpfe, vier Hände, vier Augen. Bleib in Griffweite, bei guten Bedingungen höchstens etwa <b>3 Meter</b> entfernt. Sprecht vor dem Tauchgang ab, wer führt.</p>"},
  {h:"Handzeichen", html:"<p>Unter Wasser kann man nicht sprechen. Diese vier Zeichen sind in den Unterlagen abgebildet:</p><div class='signs' id='signs'></div><p class='muted'>Achtung: Daumen hoch heisst beim Tauchen <b>Auftauchen</b>, nicht „super“. Weitere Zeichen lernt ihr im Kurs.</p><p>Andere Wege, sich zu verständigen: auf die Flasche klopfen, Buddy antippen, Schreibtafel, Signalpfeife an der Oberfläche.</p>"},
  {h:"Wichtige Wörter", html:"<ul><li><b>Sicherheitsstopp:</b> am Ende jedes Tauchgangs 3 bis 5 Minuten auf 5 Meter Tiefe warten. Im Notfall darf man ihn weglassen.</li><li><b>Nullzeit:</b> so lange darfst du auf einer Tiefe bleiben und trotzdem jederzeit direkt auftauchen, ohne Pflicht-Stopps.</li><li><b>SCUBA:</b> „Self-Contained Underwater Breathing Apparatus“, also ein Atemgerät, das man selbst mitträgt.</li><li><b>Nitrox:</b> Atemgas mit mehr Sauerstoff als normale Luft. Dafür braucht man eine extra Ausbildung.</li></ul>"},
  {h:"Vor und nach dem Tauchen", html:"<ul><li>Genug Wasser trinken, normal essen (nicht zu fett, nicht zu viel).</li><li>Kein Alkohol, nicht krank oder erkältet tauchen.</li><li>Nach dem Tauchen nicht gleich fliegen oder in die Berge fahren. Der niedrigere Luftdruck in der Höhe kann gefährlich sein. Wie lange man warten muss, sagt der Tauchcomputer oder der Instructor.</li></ul>"}
  ],
  merke:["Atem nie anhalten.","Luft immer kennen.","Langsam auftauchen, höchstens 9 m pro Minute.","Sicherheitsstopp: 5 m, 3 bis 5 Minuten."],
  frag:["Wie lange sollen wir nach dem Tauchen mit dem Rückflug warten? (Die Unterlagen nennen einmal „12 bzw. 24 Stunden“ und einmal „12 bis 24 Stunden“.)"]
},
{ id:"ausruestung", titel:"Ausrüstung", kurz:"Maske, Flossen, Anzug, Jacket, Atemregler, Flasche, Computer",
  quelle:"Ausrüstung",
  secs:[
  {h:"Maske und Schnorchel", html:"<ul><li>Eine Tauchmaske bedeckt auch die <b>Nase</b>. Nur so kannst du Luft in die Maske blasen, wenn sie in der Tiefe ans Gesicht gedrückt wird. Eine Schwimmbrille geht deshalb nicht.</li><li>Passt die Maske? Aufs Gesicht legen, <b>ohne einzuatmen</b>, und schauen, ob überall Kontakt ist.</li><li>Eine neue Maske hat einen Schutzfilm. Den mit Zahnpasta (kein Gel) innen wegreiben, sonst beschlägt das Glas.</li><li>Das Maskenband nicht zu fest ziehen.</li><li>Den Schnorchel brauchst du an der Oberfläche. So sparst du die Luft aus der Flasche.</li></ul>"},
  {h:"Flossen", html:"<ul><li><b>Vollfussflossen</b> zieht man barfuss an. Sie sind gut für warmes Wasser und Bootstauchgänge.</li><li><b>Geräteflossen</b> (offene Ferse) trägt man mit Füsslingen. Die meisten Taucher nutzen diese.</li><li>Lange Freitauchflossen sind zum Gerätetauchen nicht geeignet.</li></ul>"},
  {h:"Tauchanzug", html:"<ul><li>Wasser kühlt den Körper etwa <b>20-mal schneller</b> als Luft.</li><li><b>Nassanzug</b> aus Neopren: Eine dünne Wasserschicht kommt hinein, wird vom Körper warm und isoliert.</li><li>In der Tiefe werden die Luftbläschen im Neopren zusammengedrückt. Der Anzug wärmt dann weniger und hat weniger Auftrieb.</li><li>Über Kopf und Nacken geht viel Wärme verloren. Eine Kopfhaube hilft.</li><li>Ein <b>Trockenanzug</b> lässt kein Wasser hinein. Dafür braucht man eine extra Ausbildung.</li></ul>"},
  {h:"Tarierjacket (Tariersystem)", html:"<ul><li>Mehr Luft im Jacket heisst mehr Auftrieb, du steigst. Luft raus heisst, du sinkst.</li><li>Am <b>Inflator</b> gibt es einen Knopf zum Aufblasen und einen zum Ablassen. Man kann das Jacket auch mit dem Mund aufblasen.</li><li>Zum Ablassen den Faltenschlauch <b>nach oben</b> halten, denn die Luft sammelt sich oben.</li><li>Wichtig: Das Jacket ist <b>keine Rettungsweste</b>. Es hält einen bewusstlosen Menschen nicht sicher mit dem Gesicht nach oben.</li></ul>"},
  {h:"Atemregler", html:"<ul><li>Die <b>1. Stufe</b> sitzt am Flaschenventil. Sie senkt den Druck von etwa 200 bar auf etwa 8 bis 10 bar.</li><li>Die <b>2. Stufe</b> ist das Mundstück. Sie gibt dir Luft mit genau dem Druck, der um dich herum herrscht.</li><li>Der <b>Ersatzatemregler</b> („Oktopus“) ist für den Notfall, wenn deinem Buddy die Luft ausgeht. Er sitzt gut sichtbar zwischen Kinn und unterem Rippenbogen.</li></ul>"},
  {h:"Flasche, Instrumente, Blei", html:"<ul><li>Die Flasche nie ganz leer atmen, nicht in die Sonne oder ins heisse Auto legen und nie unbeaufsichtigt aufrecht stehen lassen.</li><li><b>Finimeter:</b> zeigt, wie viel Luft (bar) noch in der Flasche ist.</li><li><b>Tauchcomputer:</b> zeigt Tiefe, Zeit und Nullzeit und warnt bei zu schnellem Aufstieg. Niemals mit jemandem teilen und vor dem Tauchen den Akku prüfen.</li><li><b>Blei</b> brauchst du, damit du überhaupt sinken kannst. Es muss sich im Notfall mit einer Hand schnell abwerfen lassen. Den Bleigürtel trägt man so, dass er sich mit der <b>rechten Hand</b> öffnen lässt.</li><li><b>Boje (SMB):</b> zeigt Booten, wo du bist. Die Leine nie am Körper festbinden, sonst kann dich die Strömung nach oben ziehen.</li></ul>"},
  {h:"Pflege nach dem Tauchen", html:"<ul><li>Alles mit Süsswasser abspülen.</li><li>Die Staubkappe trocken auf die 1. Stufe setzen. In die 1. Stufe darf <b>kein Wasser</b> kommen, also nie untertauchen.</li><li>Im Schatten und luftig trocknen lassen.</li></ul>"}
  ],
  merke:["Maske ohne Einatmen anprobieren.","Jacket: Luft rein = steigen, Luft raus = sinken.","Ersatzatemregler ist für den Buddy.","Tauchcomputer nie teilen."],
  frag:["Welche Ausrüstung sollen wir selbst kaufen und was leihen wir in Ägypten? (Die Unterlagen empfehlen eigene Maske, Schnorchel, Flossen und Füsslinge.)"]
},
{ id:"physik", titel:"Physik unter Wasser", kurz:"Auftrieb, Druck, Luftverbrauch, Sehen, Hören, Kälte",
  quelle:"Physik",
  secs:[
  {h:"Auftrieb", html:"<p>Wasser drückt alles nach oben, das ist der Auftrieb. Es gibt drei Zustände:</p><ul><li><b>Positiv:</b> Du treibst an der Oberfläche (Jacket aufgeblasen).</li><li><b>Neutral:</b> Du schwebst, ohne zu sinken oder zu steigen. Das ist das Ziel unter Wasser.</li><li><b>Negativ:</b> Du sinkst (Jacket leer).</li></ul><p>Auch deine <b>Lunge</b> verändert den Auftrieb: Einatmen hebt dich ein wenig, Ausatmen lässt dich sinken. Damit kann man fein steuern.</p>"},
  {h:"Richtig viel Blei", html:"<ul><li>Test: Mit leerem Jacket und einem tiefen, angehaltenen Atemzug liegt die Wasseroberfläche genau auf Höhe deines Scheitels.</li><li><b>Salzwasser</b> ist schwerer als Süsswasser und trägt mehr. Im Meer brauchst du deshalb <b>mehr Blei</b> als im Schwimmbad oder See.</li><li>Zu viel Blei ist gefährlich und macht das Tarieren schwer.</li></ul>"},
  {h:"Druck und Luft", html:"<p>Je tiefer, desto mehr Wasser drückt auf dich. Alle 10 Meter Meerwasser kommt 1 bar dazu. Luft lässt sich zusammendrücken:</p><div class='tbl'><table><tr><th>Tiefe</th><th>Druck</th><th>Ein Ballon ist so gross</th></tr><tr><td>0 m</td><td>1 bar</td><td>ganz</td></tr><tr><td>10 m</td><td>2 bar</td><td>½</td></tr><tr><td>20 m</td><td>3 bar</td><td>⅓</td></tr><tr><td>30 m</td><td>4 bar</td><td>¼</td></tr></table></div><p>Die grösste Veränderung passiert auf den <b>ersten 10 Metern</b>. Dort ist besondere Vorsicht nötig.</p>"},
  {h:"Warum nie den Atem anhalten?", html:"<p>Mit dem Tauchgerät atmest du Luft, die so stark zusammengedrückt ist wie das Wasser um dich herum. Beim Auftauchen dehnt sie sich aus. Hältst du dabei die Luft an, wird die Lunge überdehnt und kann reissen. Das ist lebensgefährlich.</p><p>Beim Schnorcheln ist das anders: Du nimmst oben einen Atemzug, der unten zusammengedrückt wird und oben wieder normal gross ist.</p>"},
  {h:"Luftverbrauch", html:"<p>In 20 m Tiefe (3 bar) brauchst du für jeden Atemzug <b>3-mal so viel Luft</b> wie oben. Reicht die Flasche an der Oberfläche 60 Minuten, ist sie in 20 m schon nach etwa 20 Minuten leer. Je flacher du tauchst, desto länger reicht die Luft.</p>"},
  {h:"Sehen, Farben, Hören, Kälte", html:"<ul><li>Durch die Maske wirkt alles etwa <b>⅓ grösser und näher</b>. Darum greift man am Anfang oft daneben.</li><li><b>Rot und Orange</b> verschwinden mit der Tiefe zuerst, Blau bleibt. Mit einer Lampe sieht man die echten Farben.</li><li>Schall ist unter Wasser schneller und weiter. Man kann aber kaum hören, <b>woher</b> ein Geräusch kommt.</li><li>Wasser kühlt etwa 20-mal schneller als Luft. Auch die kalte Atemluft aus der Flasche kühlt dich von innen.</li></ul>"},
  {h:"Für Profis: Partialdruck", html:"<p>Luft besteht aus etwa 21 % Sauerstoff und 79 % Stickstoff. Der Anteil bleibt gleich, aber der Druck jedes Gases steigt mit der Tiefe. Sauerstoff hat oben 0,21 bar, in 20 m (3 bar) sind es 0,21 × 3 = <b>0,63 bar</b>.</p>"}
  ],
  merke:["Alle 10 m Meerwasser: +1 bar.","Auf den ersten 10 m ändert sich am meisten.","Im Meer mehr Blei als im Pool.","Tiefer = mehr Luftverbrauch."],
  frag:[]
},
{ id:"koerper", titel:"Dein Körper beim Tauchen", kurz:"Druckausgleich, Ohren, Lunge, Stickstoff, Kälte",
  quelle:"Physiologie; Physik",
  secs:[
  {h:"Druckausgleich", html:"<ul><li>Beim Abtauchen drückt das Wasser auf die Luft in Ohren, Nebenhöhlen und Maske. Diesen Druck musst du ausgleichen.</li><li><b>Früh und oft</b>: am besten schon vor dem Einstieg einmal testen, dann etwa <b>jeden Meter</b>.</li><li><b>Valsalva</b>: Nase zuhalten und <b>sanft</b> dagegen ausatmen. Auch Schlucken, Gähnen oder Kauen kann helfen.</li><li>Nicht fest pressen, das kann das Innenohr verletzen.</li><li>Für die <b>Maske</b>: einfach leicht durch die Nase in die Maske ausatmen.</li></ul>"},
  {h:"Wenn das Ohr wehtut", html:"<ol><li>Etwa 1 Meter aufsteigen.</li><li>Nochmal vorsichtig ausgleichen.</li><li>Geht es nicht: Tauchgang abbrechen, dem Buddy Bescheid geben, langsam auftauchen.</li><li>Bleiben Schmerzen, Schwindel oder Blut in der Maske: zum Arzt.</li></ol><p><b>Nie mit Schnupfen oder Erkältung tauchen.</b> Dann klappt der Druckausgleich nicht richtig.</p>"},
  {h:"Lungenverletzung (AGE)", html:"<p>Wer beim Auftauchen die Luft anhält, kann die Lunge überdehnen. Dann gelangt Luft ins Blut. Schon 1 bis 1,5 m Aufstieg mit voller, angehaltener Lunge können reichen. Die Anzeichen kommen <b>schnell</b>, noch beim oder direkt nach dem Auftauchen: Verwirrung, Schwindel, Lähmung, Bewusstlosigkeit.</p>"},
  {h:"Stickstoff und Dekompressionskrankheit (DCS)", html:"<ul><li>Unter Druck löst sich Stickstoff aus der Atemluft im Körper. Beim langsamen Auftauchen atmet man ihn wieder ab.</li><li>Taucht man zu schnell auf, bilden sich zu grosse Bläschen. Das kann Gelenkschmerzen, Kribbeln, Hautreizungen und sogar Lähmungen auslösen. Diese Anzeichen kommen oft etwas <b>später</b>.</li><li>Vorbeugen: langsam auftauchen (max. 9 m/min), Sicherheitsstopp, genug trinken, innerhalb der Nullzeit bleiben.</li><li>Bei Verdacht: nicht mehr tauchen, <b>100 % Sauerstoff</b> atmen, sofort Arzt oder Notdienst. Anzeichen nie kleinreden.</li></ul>"},
  {h:"Tiefenrausch", html:"<p>Ab etwa 30 m kann der Stickstoff wie Alkohol wirken: falsches Sicherheitsgefühl, schlechtes Urteilen. Ein paar Meter höher verschwindet es schnell wieder. Für euren Kurs seid ihr nie so tief.</p>"},
  {h:"Atmung, Anstrengung, Kälte", html:"<ul><li>Den Drang zu atmen löst vor allem das <b>Kohlendioxid</b> aus, nicht der Sauerstoffmangel.</li><li>Deshalb ist es beim <b>Schnorcheltauchen gefährlich</b>, vorher viele Male schnell und tief zu atmen (hyperventilieren). Man kann dabei ohne Vorwarnung bewusstlos werden.</li><li>Ausser Atem? <b>Stoppen, atmen, nachdenken</b>, dann handeln. Dem Buddy Bescheid geben.</li><li>Schon 2 °C mehr oder weniger Körpertemperatur sind ein Problem. Wer unter Wasser zittert, beendet den Tauchgang.</li><li>In warmen Ländern den Anzug erst kurz vor dem Tauchen anziehen, sonst überhitzt man.</li></ul>"}
  ],

{ id:"planen", titel:"Einen Tauchgang planen", kurz:"Plan, Buddy-Check, Luftreserve, Tauchcomputer, Boot",
  quelle:"Management; Freiwasser",
  secs:[
  {h:"Was gehört in den Plan?", html:"<ul><li>Wetter, Wellen, Strömung, Gezeiten</li><li>Wo steigt ihr ein und wieder aus?</li><li>Welche Richtung, wie tief, wie lange?</li><li>Bei wie viel Luft kehrt ihr um?</li><li>Welche Handzeichen nutzt ihr?</li><li>Was tut ihr, wenn ihr euch verliert?</li></ul><p>Und dann: <b>sich an den Plan halten.</b></p>"},
  {h:"Buddy verloren", html:"<ol><li>Etwa <b>1 Minute</b> lang suchen.</li><li>Langsam auftauchen und sich dabei umschauen.</li><li>Oben treffen: Jacket aufblasen und Ausschau halten.</li></ol>"},
  {h:"Buddy-Check vor dem Einstieg", html:"<p>Die RAID-Unterlagen nennen fünf Punkte "+R+":</p><ol><li>Flaschenventil offen</li><li>Atemregler funktionieren, Flasche voll</li><li>Flasche sitzt fest am Jacket</li><li>Jacket und Blei (Schnellabwurf)</li><li>Zum Schluss: Instrumente, Flossen, Maske, alles okay</li></ol><p class='muted'>Im PADI-Kurs kann der Check anders aufgebaut sein oder einen eigenen Merkspruch haben.</p>"},
  {h:"Was begrenzt die Tauchzeit?", html:"<ul><li>der Luftvorrat</li><li>die Nullzeit</li><li>Kälte</li><li>die erlaubte Tiefe</li></ul><p>Es gilt immer der <b>vorsichtigste</b> Wert.</p>"},
  {h:"Luftreserve", html:"<p>Plane immer eine Reserve ein. Die RAID-Unterlagen sagen: Aufstieg beginnen bei mindestens <b>50 bar</b> "+R+". Vor dem Tauchgang sollten 170 bis 200 bar in der Flasche sein.</p>"},
  {h:"Tauchcomputer", html:"<ul><li>Vor dem Tauchen einschalten und den Akku prüfen.</li><li>Zeigt dir die verbleibende Nullzeit. Wenn du tiefer gehst, wird sie kürzer.</li><li>Warnungen nie ignorieren.</li><li>Nie teilen, denn er rechnet mit <b>deinen</b> Tauchgängen.</li></ul>"},
  {h:"Tauchen vom Boot", html:"<ul><li><b>Bug</b> = vorne, <b>Heck</b> = hinten, <b>Backbord</b> = links, <b>Steuerbord</b> = rechts (nach vorne geschaut).</li><li>Vom grossen Boot: <b>grosser Schritt vorwärts</b>. Vom kleinen Boot oder Schlauchboot: <b>Rolle rückwärts</b>. Vorher prüfen, ob unten frei ist.</li><li>Beim Ein- und Aussteigen müssen die Schiffsschrauben stillstehen.</li><li>Gegen Seekrankheit: zum Horizont schauen, frische Luft, nichts Fettiges essen, viel Wasser trinken.</li></ul>"},
  {h:"Für Profis: Luftverbrauch rechnen", html:"<p>Beispiel aus den Unterlagen: Flasche mit 11,1 Litern, 200 bar, Reserve 50 bar.</p><ol><li>Nutzbar: 150 bar × 11,1 l = <b>1665 Liter</b> (bei Oberflächendruck)</li><li>Verbrauch an der Oberfläche: 20 l/min. In 18 m sind es 2,8 bar, also 20 × 2,8 = <b>56 l/min</b>.</li><li>1665 ÷ 56 ≈ <b>30 Minuten</b>. Ein geplanter 40-Minuten-Tauchgang auf 18 m klappt also nicht.</li></ol>"}
  ],
  merke:["Oben angekommen: zuerst Jacket aufblasen, dann reden.","Buddy weg: 1 Minute suchen, dann auftauchen.","Plan machen und einhalten.","Immer Luftreserve behalten."],
  frag:["Bei wie viel bar sollen wir den Aufstieg beginnen? (Die Unterlagen nennen einmal 50 bar und einmal „mit mindestens 30 bar an der Oberfläche“.)","Wie heisst der Buddy-Check im PADI-Kurs?"]
},
{ id:"umwelt", titel:"Unterwasserwelt und Umwelt", kurz:"Strömung, Gezeiten, Korallen, Tiere, Umweltschutz",
  quelle:"Umwelt",
  secs:[
  {h:"Bedingungen prüfen", html:"<p>Vor jedem Tauchgang: Temperatur, Sicht, Strömung und Untergrund anschauen. Frag Leute, die den Platz kennen, zum Beispiel das Tauchcenter. Manchmal wird es plötzlich deutlich kälter. So eine Schicht heisst <b>Sprungschicht</b> (Thermokline).</p>"},
  {h:"Strömungen", html:"<ul><li>Bei leichter Strömung: <b>gegen die Strömung starten</b>. Dann trägt sie dich auf dem Rückweg.</li><li>Am Grund ist die Strömung meist schwächer als an der Oberfläche.</li><li><b>Ripströmung</b>: ein schmaler, starker Strom vom Strand weg aufs Meer. Erkennbar an trübem, schäumendem Wasser. Nie dagegen anschwimmen, sondern <b>quer (im rechten Winkel)</b> herausschwimmen.</li><li>Treibst du am Ausstieg vorbei: Jacket aufblasen, um Hilfe winken, abholen lassen.</li></ul>"},
  {h:"Gezeiten und Wellen", html:"<ul><li>Gezeiten entstehen durch Mond (und ein wenig Sonne). Es gibt zwei Zyklen am Tag.</li><li><b>Springtide</b> (stark) bei Voll- und Neumond, <b>Nipptide</b> (schwach) bei Halbmond.</li><li>Dünung kann einen gegen flache Riffe drücken, deshalb Abstand halten.</li></ul>"},
  {h:"Korallen", html:"<ul><li>Korallen sind <b>Tiere</b>, winzige Polypen, keine Steine oder Pflanzen.</li><li>Sie brauchen Sonnenlicht, klares und sauberes Salzwasser und Wärme (meist 20 bis 32 °C).</li><li>Wer sie berührt, zerstört ihre Schutzschicht. Die Koralle kann dann absterben. Ein einziger Flossenschlag kann Jahrhunderte Wachstum kaputt machen.</li></ul>"},
  {h:"Tiere", html:"<ul><li>Angriffe auf Taucher sind sehr selten. Tiere verteidigen sich nur, wenn man sie stört.</li><li><b>Skorpionsfische</b> haben giftige Stacheln und sind gut getarnt, deshalb Abstand zum Boden halten.</li><li><b>Muränen</b> öffnen ständig das Maul, weil sie so atmen. Sie beissen nur, wenn man sie ärgert.</li><li><b>Rochen</b> haben oft einen Stachel am Schwanz, sind aber nicht aggressiv.</li><li><b>Haie</b> greifen Taucher extrem selten an.</li><li>Fische nicht füttern, nicht jagen, nicht anfassen.</li></ul>"},
  {h:"Umweltfreundlich tauchen", html:"<ul><li>Tarierung üben, auf den Flossenschlag achten.</li><li>Nichts anfassen: Korallen, Muscheln, bewachsene Steine.</li><li>Sonnencreme <b>20 bis 30 Minuten</b> vor dem Wasser auftragen, damit sie nicht gleich abgewaschen wird.</li><li>Kein Plastik ins Meer.</li></ul>"}
  ],
  merke:["Ripströmung: quer rausschwimmen.","Gegen die Strömung starten.","Korallen sind Tiere, nicht anfassen.","Tiere nicht füttern oder stören."],
  frag:[]
},
{ id:"helfen", titel:"Probleme lösen und helfen", kurz:"Ohne Luft, Krampf, Panik, Notaufstieg, Erste Hilfe",
  quelle:"Rettung; Management (Problemmanagement)",
  secs:[
  {h:"Stoppen, atmen, nachdenken, handeln", html:"<p>Das ist die Grundregel für jedes Problem: Erst anhalten, ruhig atmen, kurz überlegen, dann handeln. Nicht in Panik reagieren.</p>"},
  {h:"An der Oberfläche", html:"<ul><li>Laut den Unterlagen passieren <b>mehr Unfälle an der Oberfläche</b> als in der Tiefe.</li><li>Immer zuerst <b>positiven Auftrieb</b> herstellen, also Jacket aufblasen. Im Notfall Blei abwerfen.</li><li>Dann nicht strampeln, sondern ruhig treiben und Hilfe holen.</li><li>Beim Husten oder bei Übelkeit den <b>Atemregler im Mund</b> behalten.</li></ul>"},
  {h:"Keine Luft mehr", html:"<p><b>Beste Lösung: Luft vom Buddy.</b></p><ol><li>Zeichen „keine Luft“ geben.</li><li>Laut den RAID-Unterlagen gibt dir der Buddy seinen Hauptatemregler und nimmt selbst seinen Ersatzatemregler "+R+".</li><li>Mundstück richtig herum, ausblasen, atmen.</li><li>Gegenseitig festhalten, Instrumente prüfen, gemeinsam langsam auftauchen.</li></ol><p><b>Letzte Möglichkeit, wenn kein Buddy da ist: kontrollierter Notaufstieg (CESA).</b> Zur Oberfläche schwimmen und dabei die ganze Zeit langsam ausatmen, mit einem „aaah“-Ton. Der Atemregler bleibt im Mund. Nicht schneller als 9 m pro Minute.</p>"},
  {h:"Andere Probleme", html:"<ul><li><b>Krampf in der Wade:</b> Flossenspitze zu dir ziehen und so den Muskel dehnen. Danach gemütlich weiter.</li><li><b>Atemregler bläst ab</b> (Luft strömt ständig): Mundstück locker im Mund lassen und weiteratmen, dem Buddy Bescheid geben, auftauchen.</li><li><b>Verheddert:</b> stoppen, atmen, Buddy um Hilfe bitten.</li><li><b>Tauchcomputer fällt aus:</b> dem Buddy zeigen und kontrolliert auftauchen.</li><li><b>Unwohlsein:</b> Tiefe und Luft prüfen, 2 bis 3 tiefe Atemzüge, Buddy informieren, auftauchen.</li></ul>"},
  {h:"Einem anderen Taucher helfen", html:"<ul><li>Zeichen von Panik: Kopf krampfhaft über Wasser, Atemregler ausgespuckt, Maske auf der Stirn, schnelle Atmung, reagiert nicht auf Zurufe.</li><li>Als Tauchanfänger <b>dich nicht selbst in Gefahr bringen</b>. Schwimmhilfe zuwerfen, Hilfe rufen.</li><li>Taucher treibt mit dem Gesicht nach unten: auf die Schulter tippen. Reagiert er nicht, auf den Rücken drehen, damit Mund und Nase an der Luft sind, und um Hilfe rufen.</li><li>Ein Erste-Hilfe-Kurs mit Herz-Lungen-Wiederbelebung wird in den Unterlagen ausdrücklich empfohlen.</li></ul>"}
  ],
  merke:["Stoppen, atmen, nachdenken, handeln.","Oben: zuerst Auftrieb.","Keine Luft: zuerst zum Buddy.","Notaufstieg: ausatmen mit „aaah“."],
  frag:["Wie läuft die Luftspende im PADI-Kurs: Gibt der Spender den Hauptatemregler oder den Ersatzatemregler?","Was genau tun wir, wenn der Tauchcomputer unter Wasser ausfällt? (Die Unterlagen beschreiben das an verschiedenen Stellen unterschiedlich.)"]
},
{ id:"uebungen", titel:"Die Übungen im Pool und im Meer", kurz:"Was ihr im Kurs üben werdet, Schritt für Schritt",
  quelle:"Begrenztes Freiwasser; Freiwasser",
  secs:[
  {h:"So läuft der Kurs ab", html:"<ul><li>Zuerst üben im <b>Pool oder ruhigen Flachwasser</b>, danach im <b>offenen Meer</b>.</li><li>Jede Übung wird erst erklärt, dann gezeigt, dann geübt, bis sie sitzt. Wer länger braucht, bekommt mehr Zeit.</li><li>Vorher gibt es einen Schwimmtest. Bei RAID sind das 200 m ohne Hilfsmittel oder 300 m mit Maske, Schnorchel und Flossen, dazu 10 Minuten im tiefen Wasser treiben "+R+". Bei PADI kann das anders sein.</li></ul>"},
  {h:"Abtauchen (5 Schritte)", html:"<ol><li>Dem Buddy zeigen: bereit.</li><li>Orientieren: Wo ist der Ausstieg, wohin geht es?</li><li>Atemregler im Mund, Instrumente prüfen.</li><li>Faltenschlauch hoch, Luft aus dem Jacket lassen.</li><li>Druckausgleich, dann etwa jeden Meter wieder.</li></ol>"},
  {h:"Auftauchen", html:"<ol><li>Dem Buddy zeigen: Auftauchen.</li><li>Instrumente prüfen.</li><li>Faltenschlauch hoch, damit du Luft ablassen kannst.</li><li>Nach oben schauen, ob frei ist.</li><li>Langsam steigen, max. 9 m/min, Buddy im Blick.</li><li>Oben sofort Jacket aufblasen.</li></ol>"},
  {h:"Atemregler-Übungen", html:"<ul><li><b>Ausblasen:</b> Regler wieder in den Mund nehmen und kräftig hineinpusten. Oder die <b>Luftdusche</b> drücken, wenn du keine Luft mehr in der Lunge hast.</li><li>Ohne Regler im Mund immer <b>kleine Bläschen ausatmen</b>, nie die Luft anhalten.</li><li><b>Wiederfinden (Armschwing-Methode):</b> nach rechts neigen, rechten Arm nach vorne strecken, eng am Körper nach unten und hinten bis zur Flasche streichen, dann seitlich ausstrecken. Der Schlauch hängt jetzt über dem Arm.</li><li><b>Wiederfinden (Ventilgriff-Methode):</b> mit links die Flasche von unten hochschieben, mit rechts über die Schulter zum Schlauch greifen.</li></ul>"},
  {h:"Masken-Übungen", html:"<ul><li><b>Maske ausblasen:</b> Den oberen Rand leicht an die Stirn drücken, durch die Nase ausatmen und den Kopf etwas nach oben neigen. Das Wasser läuft unten raus.</li><li><b>Maske ab- und wieder aufsetzen</b>, dann ausblasen.</li><li><b>Ohne Maske schwimmen</b>: nicht die Nase zuhalten, nur durch den Mund atmen.</li></ul>"},
  {h:"Weitere Übungen", html:"<ul><li><b>S-Drill</b> (S wie Safety): Der Buddy schaut, ob irgendwo Bläschen austreten, und beide Atemregler werden kurz getestet.</li><li><b>Schweben</b> mit neutraler Tarierung, feinsteuern mit der Atmung.</li><li><b>Luftspende</b> stehend, beim Aufstieg und schwimmend, als Spender und als Empfänger.</li><li><b>Inflatorschlauch abkoppeln</b>, falls er klemmt und das Jacket sich von selbst aufbläst.</li><li><b>Jacket mit dem Mund aufblasen.</b></li><li><b>Abblasender Atemregler</b>, Krampf lösen, müden Taucher abschleppen.</li><li>Blei und Tauchgerät ab- und wieder anlegen.</li><li><b>Boje (SMB) setzen</b> und den <b>Notaufstieg (CESA)</b> waagerecht üben.</li><li>Im Meer zusätzlich: <b>Kompass</b>-Navigation.</li></ul>"},
  {h:"Tiefen im Kurs", html:"<p>Bei RAID gehen die ersten beiden Meer-Tauchgänge bis 12 m, die nächsten bis 18 m (Junior: 15 m) "+R+". Euer PADI-Kurs hat eigene Grenzen, siehe Startseite.</p>"}
  ],
  merke:["Ohne Regler im Mund: Bläschen ausatmen.","Maske: oben andrücken, Nase ausatmen.","Abtauchen und Auftauchen mit Schlauch nach oben.","Üben, bis es sitzt. Nachfragen ist erlaubt."],
  frag:["Welche Übungen und welchen Schwimmtest gibt es im PADI-Kurs genau?"]
}

  app.innerHTML =
  "<header class='hero'><div><span class='eyebrow'>Open-Water-Theorie · Frühjahr 2027</span><h1>Logbuch Tauchtheorie</h1>"+
  "<p>Acht Lernpakete aus den Kursunterlagen, jedes mit Quiz. Lies ein Paket, dann prüf dich selbst. Die Basis-Stufe reicht für den Kurs, die Plus-Stufe ist für alle, die mehr wissen wollen.</p></div>"+
  "<div class='gauge' aria-label='Tiefenskala'>"+
   mk(0,"0 m Oberfläche")+mk(5,"<b>5 m</b> Sicherheitsstopp",1)+mk(12,"<b>12 m</b> PADI 10–11 J.",1)+mk(18,"<b>18 m</b> PADI 12–14 J.",1)+mk(20,"20 m RAID OW20")+
  "</div></header>"+
  "<section class='note warn'><h3>Euer Kurs ist ein PADI-Kurs</h3><p>Der Lernstoff kommt aus den RAID-Unterlagen. Die Inhalte sind sehr ähnlich, aber Zahlen und Regeln können sich unterscheiden. Was nur für RAID gilt, ist mit "+R+" markiert.</p>"+
  "<p>Laut PADI gilt: <b>10 bis 11 Jahre</b> Junior Open Water, max. 12 m, Buddy nur Elternteil, Vormund oder PADI-Profi. <b>12 bis 14 Jahre</b> Junior Open Water, max. 18 m, mit einem zertifizierten Erwachsenen. Bitte beim Tauchcenter bestätigen lassen.</p></section>"+
  "<section class='list'>"+rows+"</section>"+
  "<section class='special'><button data-go='quiz-sicherheit' class='sos'><b>Sicherheits-Check</b><span>"+nSafe+" Fragen, die jede Taucherin sicher wissen muss</span></button>"+
  "<button data-go='quiz-abschluss'><b>Abschlussquiz</b><span>20 gemischte Fragen aus allen Paketen</span></button></section>"+
  "<section class='note'><h3>Fragen an den Instructor</h3><p>An manchen Stellen widersprechen sich die Unterlagen oder sagen nichts zum PADI-Kurs. Diese Punkte sind nicht im Quiz. Sammelt sie und fragt im Kurs nach:</p><ul>"+
  PAKETE.reduce(function(a,p){return a.concat(p.frag)},[]).map(function(f){return "<li>"+esc(f)+"</li>"}).join("")+"</ul></section>"+
  "<p class='src'>Quellen: RAID Open Water 20 Diver Kursmanuals (Deutsch, Stand 05/2024); PADI-Altersregeln laut blog.padi.com. Fortschritt wird nur auf diesem Gerät gespeichert.</p>";
}
function mk(m,label,hot){return "<span class='mk"+(hot?" hot":"")+"' style='top:"+(m/20*100)+"%'>"+label+"</span>"}

function lesson(id){
  var p = paket(id), i = PAKETE.indexOf(p);
  var read = store.get("read",{});
  app.innerHTML =
  "<div class='top'><button class='back' data-go=''>← Übersicht</button><span class='eyebrow'>Paket "+(i+1)+" von "+PAKETE.length+"</span></div>"+
  "<h1>"+esc(p.titel)+"</h1><p class='src'>Aus: "+esc(p.quelle)+"</p>"+
  p.secs.map(function(s){return "<section class='sec'><h2>"+esc(s.h)+"</h2>"+s.html+"</section>"}).join("")+
  "<section class='merke'><span class='eyebrow'>Merke</span><ul>"+p.merke.map(function(m){return "<li>"+esc(m)+"</li>"}).join("")+"</ul></section>"+
  (p.frag.length?"<section class='note'><h3>Frag deinen Instructor</h3><ul>"+p.frag.map(function(f){return "<li>"+esc(f)+"</li>"}).join("")+"</ul></section>":"")+
  "<div class='actions'><button class='btn' data-go='quiz-"+p.id+"'>Quiz starten</button><button class='btn alt' id='mark'>"+(read[id]?"Gelesen ✓":"Als gelesen markieren")+"</button></div>";
  var sg = document.getElementById("signs");
  if(sg) sg.innerHTML = SIGNS.map(function(s){return "<div class='sign'><svg viewBox='0 0 64 64' aria-hidden='true'>"+s[1]+"</svg><b>"+s[0]+"</b></div>"}).join("")+
    "<p class='src' style='grid-column:1/-1'>Vereinfachte Skizzen. Das echte Aussehen zeigt euch der Instructor: Stopp = flache Hand nach vorne, Abtauchen = Daumen runter, Auftauchen = Daumen hoch, Problem = flache Hand hin und her kippen.</p>";
  document.getElementById("mark").onclick = function(){var r=store.get("read",{});r[id]=true;store.set("read",r);this.textContent="Gelesen ✓"};
  window.scrollTo(0,0);
}

function alle(){var out=[];PAKETE.forEach(function(p){FRAGEN[p.id].forEach(function(f){f.pk=p.id;out.push(f)})});return out}

var Q = null;
function quizStart(key){
  var titel, basis = true, frei = false;
  if(key==="sicherheit"){titel="Sicherheits-Check"; frei=true}
  else if(key==="abschluss"){titel="Abschlussquiz"}
  else {titel="Quiz: "+paket(key).titel}
  app.innerHTML = "<div class='top'><button class='back' data-go=''>← Übersicht</button></div><h1>"+esc(titel)+"</h1>"+
   (frei?"<p>Diese Fragen sind besonders wichtig für eure Sicherheit. Ziel: alles richtig.</p>":"<p>Welche Stufe möchtest du?</p>")+
   "<div class='levels'>"+(frei?"<button class='btn orange' data-lvl='b'>Los geht’s</button>":"<button class='btn' data-lvl='b'>Basis</button><button class='btn alt' data-lvl='p'>Basis + Plus</button>")+"</div>";
  app.querySelectorAll("[data-lvl]").forEach(function(b){b.onclick=function(){
    var plus = b.getAttribute("data-lvl")==="p", pool;
    if(key==="sicherheit") pool = alle().filter(function(f){return f.x});
    else if(key==="abschluss") pool = shuffle(alle().filter(function(f){return plus||!f.p})).slice(0,20);
    else pool = FRAGEN[key].filter(function(f){return plus||!f.p});
    Q = {key:key,titel:titel,list:shuffle(pool),i:0,right:0,wrong:[]};
    ask();
  }});
}
function ask(){
  var f = Q.list[Q.i];
  var opts = shuffle(f.a.map(function(t,i){return {t:t,ok:i===0}}));
  app.innerHTML = "<div class='top'><button class='back' data-go=''>← Abbrechen</button><span class='eyebrow'>Frage "+(Q.i+1)+" von "+Q.list.length+(f.p?" · Plus":"")+"</span></div>"+
   "<div class='bar'><i style='width:"+(Q.i/Q.list.length*100)+"%'></i></div>"+
   "<p class='q'>"+esc(f.q)+"</p><div class='opts'>"+opts.map(function(o,i){return "<button class='opt' data-i='"+i+"'>"+esc(o.t)+"</button>"}).join("")+"</div><div id='fb'></div>";
  app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
    var o = opts[+b.getAttribute("data-i")];
    app.querySelectorAll(".opt").forEach(function(x,i){x.disabled=true;if(opts[i].ok)x.classList.add("right")});
    if(o.ok){Q.right++}else{b.classList.add("wrong");Q.wrong.push(f)}
    var last = Q.i===Q.list.length-1;
    document.getElementById("fb").innerHTML = "<div class='fb "+(o.ok?"ok":"no")+"'><b>"+(o.ok?"Richtig!":"Nicht ganz.")+"</b><p>"+esc(f.e)+"</p><p class='src'>Nachlesen: "+esc(f.s)+"</p></div>"+
      "<div class='actions' style='margin-top:12px'><button class='btn' id='next'>"+(last?"Ergebnis":"Weiter")+"</button></div>";
    document.getElementById("next").onclick = function(){Q.i++; if(Q.i<Q.list.length) ask(); else done()};
    document.getElementById("next").focus();
  }});
  window.scrollTo(0,0);
}
function done(){
  var pct = Math.round(Q.right/Q.list.length*100);
  var best = store.get("best",{});
  if(best[Q.key]==null||pct>best[Q.key]){best[Q.key]=pct;store.set("best",best)}
  var msg = pct===100?"Perfekt! Alles richtig.":pct>=80?"Sehr gut, du bist fast sicher.":pct>=50?"Ein guter Anfang. Lies die markierten Stellen nochmal.":"Lies das Paket noch einmal in Ruhe und versuch es dann nochmal.";
  app.innerHTML = "<div class='top'><button class='back' data-go=''>← Übersicht</button></div><h1>"+esc(Q.titel)+"</h1>"+
   "<div><div class='score'>"+Q.right+" / "+Q.list.length+"</div><p>"+msg+"</p></div>"+
   (Q.wrong.length?"<section class='review'><h2>Das solltest du nochmal anschauen</h2>"+Q.wrong.map(function(f){return "<div><b>"+esc(f.q)+"</b><span>Richtig: "+esc(f.a[0])+"</span><span class='src'>"+esc(f.s)+"</span></div>"}).join("")+"</section>":"")+
   "<div class='actions'><button class='btn' id='again'>Nochmal</button>"+(paket(Q.key)?"<button class='btn alt' data-go='paket-"+Q.key+"'>Paket lesen</button>":"")+"</div>";
  var k = Q.key; document.getElementById("again").onclick=function(){quizStart(k)};
  window.scrollTo(0,0);
}

function route(){
  var h = (location.hash||"").replace("#","");
  if(h.indexOf("paket-")===0 && paket(h.slice(6))) lesson(h.slice(6));
  else if(h.indexOf("quiz-")===0) quizStart(h.slice(5));
  else home();
}
app.addEventListener("click",function(e){
  var t = e.target.closest("[data-go]"); if(!t) return;
  var g = t.getAttribute("data-go");
  if(("#"+g)===location.hash || (g===""&&!location.hash)) route(); else location.hash = g;
  if(g==="") {try{history.replaceState(null,"",location.pathname+location.search)}catch(err){} route()}
});
window.addEventListener("hashchange",route);
route();
</script>
